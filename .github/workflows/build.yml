name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: pyflakes src tests
      - run: pytest -q

  bundle:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]   # 22.04: older glibc, so the Linux build runs on more distros
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install . pyinstaller
      - run: python packaging/build.py
      - name: Smoke test the bundle
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then exe=dist/emploid/emploid.exe; else exe=dist/emploid/emploid; fi
          "$exe" --version
          "$exe" --data-dir "$RUNNER_TEMP/jh-data" data-dir
          "$exe" --no-browser --port 8798 --data-dir "$RUNNER_TEMP/jh-data" &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8798/api/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8798/ | grep -qi "<html"
          curl -sf http://127.0.0.1:8798/world.json -o /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: emploid-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
