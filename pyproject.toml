[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emploid"
version = "1.0.0"
description = "Search internships and part-time jobs across many sources, review them, and apply, all on your own computer."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "flask>=3.0",
  "waitress>=3.0",
  "requests>=2.31",
  "playwright>=1.45",
  "geonamescache>=2.0",
  "langdetect>=1.0.9",
  "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyflakes"]

[project.scripts]
emploid = "emploid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
emploid = ["static/*", "programs.json", "companies.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
